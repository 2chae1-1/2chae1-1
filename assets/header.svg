<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="45%" stop-color="#0D1D43"/>
      <stop offset="100%" stop-color="#0A2A48"/>
    </linearGradient>

    <!-- Stream gradient -->
    <linearGradient id="stream" x1="700" y1="160" x2="1140" y2="160"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="48%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="streamSoft" x1="700" y1="160" x2="1140" y2="160"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="55%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Underline -->
    <linearGradient id="underline" x1="80" y1="150" x2="160" y2="150"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="36" height="36"
             patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            stroke="white"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="930" cy="150" rx="190" ry="125"
           fill="#6366F1" fill-opacity="0.11"
           filter="url(#blurGlow)"/>

  <ellipse cx="1080" cy="175" rx="170" ry="115"
           fill="#06B6D4" fill-opacity="0.09"
           filter="url(#blurGlow)"/>

  <!-- LEFT TEXT -->
  <text x="78" y="124"
        fill="white"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="50"
        font-weight="700"
        letter-spacing="-1.2">
    Hi, I'm Chaewon
  </text>

  <rect x="80" y="148" width="68" height="4" rx="2"
        fill="url(#underline)"/>

  <text x="80" y="196"
        fill="#D9E6F2"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="19"
        font-weight="400">
    Exploring AI through building, experimenting, and documenting.
  </text>

  <text x="80" y="242"
        fill="#9CB0C8"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="13"
        font-weight="500"
        letter-spacing="1.5">
    AI · ON-DEVICE AI · AI ENGINEERING · AI RESEARCH
  </text>


  <!-- RIGHT FLOW -->
  <g>

    <!-- soft background strands -->

    <path
      d="M700 198
         C760 184 785 122 850 120
         C920 118 944 186 1004 185
         C1062 184 1093 138 1150 122"
      stroke="#818CF8"
      stroke-opacity="0.13"
      stroke-width="1.2"
      fill="none"/>

    <path
      d="M705 225
         C775 216 795 158 858 153
         C923 148 953 211 1014 207
         C1071 204 1103 172 1152 157"
      stroke="#38BDF8"
      stroke-opacity="0.12"
      stroke-width="1.2"
      fill="none"/>

    <path
      d="M730 103
         C789 101 817 145 870 148
         C927 151 951 112 1005 102
         C1055 93 1093 104 1140 128"
      stroke="#A78BFA"
      stroke-opacity="0.12"
      stroke-width="1.2"
      fill="none"/>


    <!-- glowing base -->
    <path
      d="M692 181
         C748 178 773 136 824 132
         C882 127 908 175 962 176
         C1017 177 1042 145 1085 133
         C1111 126 1134 127 1151 133"
      stroke="url(#stream)"
      stroke-opacity="0.28"
      stroke-width="10"
      stroke-linecap="round"
      fill="none"
      filter="url(#lineGlow)"/>


    <!-- MAIN STRAND -->
    <path
      d="M692 181
         C748 178 773 136 824 132
         C882 127 908 175 962 176
         C1017 177 1042 145 1085 133
         C1111 126 1134 127 1151 133"
      stroke="url(#stream)"
      stroke-width="3.6"
      stroke-linecap="round"
      fill="none"/>


    <!-- upper strand -->
    <path
      d="M711 164
         C760 155 787 118 836 116
         C883 114 912 145 954 146
         C1000 147 1027 118 1067 110
         C1100 103 1127 108 1147 119"
      stroke="url(#streamSoft)"
      stroke-opacity="0.70"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"/>


    <!-- lower strand -->
    <path
      d="M710 199
         C759 197 791 165 839 164
         C890 162 920 199 968 201
         C1017 203 1048 176 1087 167
         C1113 161 1136 164 1153 172"
      stroke="url(#stream)"
      stroke-opacity="0.64"
      stroke-width="2.1"
      stroke-linecap="round"
      fill="none"/>


    <!-- outer upper branch -->
    <path
      d="M750 145
         C796 136 816 99 859 94
         C902 89 929 116 967 119
         C1008 122 1030 96 1065 91
         C1094 87 1117 94 1136 105"
      stroke="url(#stream)"
      stroke-opacity="0.36"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"/>


    <!-- outer lower branch -->
    <path
      d="M750 216
         C794 216 819 191 858 191
         C906 191 934 226 978 226
         C1025 226 1056 202 1092 198
         C1116 195 1136 199 1150 205"
      stroke="url(#streamSoft)"
      stroke-opacity="0.34"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"/>


    <!-- crossing / branching detail -->
    <path
      d="M795 151
         C837 154 850 188 887 188
         C923 188 940 160 970 156"
      stroke="#C4B5FD"
      stroke-opacity="0.34"
      stroke-width="1.25"
      stroke-linecap="round"
      fill="none"/>

    <path
      d="M898 140
         C929 139 945 166 970 175
         C996 184 1012 174 1037 158"
      stroke="#67E8F9"
      stroke-opacity="0.30"
      stroke-width="1.2"
      stroke-linecap="round"
      fill="none"/>


    <!-- signal nodes -->
    <g fill="white">
      <circle cx="748" cy="163" r="2.0" fill-opacity="0.72"/>
      <circle cx="824" cy="132" r="2.4" fill-opacity="0.86"/>
      <circle cx="888" cy="151" r="1.7" fill-opacity="0.62"/>
      <circle cx="962" cy="176" r="2.5" fill-opacity="0.90"/>
      <circle cx="1021" cy="166" r="1.8" fill-opacity="0.68"/>
      <circle cx="1085" cy="133" r="2.2" fill-opacity="0.82"/>
      <circle cx="1130" cy="130" r="1.7" fill-opacity="0.65"/>
    </g>


    <!-- floating particles -->
    <g fill="#E0F2FE">
      <circle cx="742" cy="104" r="1.2" fill-opacity="0.35"/>
      <circle cx="781" cy="91" r="1.5" fill-opacity="0.28"/>
      <circle cx="820" cy="218" r="1.1" fill-opacity="0.30"/>
      <circle cx="866" cy="82" r="1.3" fill-opacity="0.35"/>
      <circle cx="912" cy="222" r="1.4" fill-opacity="0.30"/>
      <circle cx="948" cy="92" r="1.2" fill-opacity="0.31"/>
      <circle cx="997" cy="237" r="1.3" fill-opacity="0.30"/>
      <circle cx="1031" cy="79" r="1.5" fill-opacity="0.35"/>
      <circle cx="1075" cy="229" r="1.1" fill-opacity="0.33"/>
      <circle cx="1116" cy="91" r="1.3" fill-opacity="0.34"/>
      <circle cx="1151" cy="186" r="1.2" fill-opacity="0.32"/>
    </g>

  </g>

</svg>